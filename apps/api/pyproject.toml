[project]
name = "quant-api"
version = "0.1.0"
description = "FastAPI and yfinance ingestion service for quant-v1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.125.0",
  "uvicorn[standard]>=0.38.0",
  "pydantic-settings>=2.12.0",
  "supabase>=2.25.0",
  "yfinance>=0.2.66",
  "pandas>=2.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "httpx>=0.28.0",
  "ruff>=0.14.0"
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
